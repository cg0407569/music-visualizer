<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Music Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #appContainer {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #centerInterface {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #logoFrame {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a2e 0%, #0c0c14 100%);
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s ease-out;
            pointer-events: auto;
            cursor: pointer;
        }
        #logoImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #logoPlaceholder {
            font-size: 14px;
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        #lyricsContainer {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            text-align: center;
            width: 80%;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 229, 255, 0.5);
        }
        #currentLyric {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        #nextLyric {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        #controlPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .panelSection {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }
        .fileInputWrapper {
            position: relative;
            width: 100%;
            height: 38px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .fileInputWrapper:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .fileInputWrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .fileLabelText {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }
        textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #fff;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            resize: vertical;
            height: 80px;
        }
        .sliderGroup {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #00e5ff;
        }
        .sliderVal {
            font-size: 12px;
            font-family: monospace;
            width: 30px;
            text-align: right;
        }
        .btnRow {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background: #00e5ff;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            background: #00b3cc;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            box-shadow: none;
        }
        #recordBtn {
            background: #ff0055;
            color: #fff;
        }
        #recordBtn:hover {
            background: #d60048;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }
        #recordBtn.recording {
            animation: pulseRecord 1.5s infinite;
            background: #bc0000;
        }
        @keyframes pulseRecord {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        #audioElement {
            display: none;
        }
    </style>
</head>
<body>

    <div id="appContainer">
        <canvas id="visualizerCanvas"></canvas>
        
        <div id="centerInterface">
            <div id="logoFrame" onclick="document.getElementById('logoInput').click()">
                <img id="logoImage" src="" style="display: none;">
                <div id="logoPlaceholder">Click to<br>Load Logo</div>
            </div>
        </div>

        <div id="lyricsContainer">
            <div id="currentLyric"></div>
            <div id="nextLyric"></div>
        </div>

        <div id="controlPanel">
            <div class="panelSection">
                <label>1. Audio Track</label>
                <div class="fileInputWrapper">
                    <span class="fileLabelText" id="audioTrackLabel">Choose audio file...</span>
                    <input type="file" id="audioInput" accept="audio/*">
                </div>
            </div>

            <div class="panelSection">
                <label>2. Center Logo Image</label>
                <div class="fileInputWrapper">
                    <span class="fileLabelText" id="logoFileLabel">Choose square image...</span>
                    <input type="file" id="logoInput" accept="image/*">
                </div>
            </div>

            <div class="panelSection">
                <label>3. Lyrics ([mm:ss.xx] Format)</label>
                <textarea id="lyricsInput" placeholder="[00:01.00] Welcome to the mix&#10;[00:04.50] Feel the bass particle flow"></textarea>
            </div>

            <div class="panelSection">
                <label>Aura Base Hue</label>
                <div class="sliderGroup">
                    <input type="range" id="hueSlider" min="0" max="360" value="190">
                    <span class="sliderVal" id="hueVal">190</span>
                </div>
            </div>

            <div class="panelSection">
                <label>Bass Sensitivity</label>
                <div class="sliderGroup">
                    <input type="range" id="sensSlider" min="1" max="5" step="0.1" value="2.5">
                    <span class="sliderVal" id="sensVal">2.5</span>
                </div>
            </div>

            <div class="btnRow">
                <button id="playBtn" disabled>Play</button>
                <button id="recordBtn" disabled>Record Video</button>
            </div>
        </div>
    </div>

    <audio id="audioElement" controls></audio>

    <script>
        // Core Web Audio & Graphic Element Selectors
        const audioInput = document.getElementById('audioInput');
        const logoInput = document.getElementById('logoInput');
        const lyricsInput = document.getElementById('lyricsInput');
        const hueSlider = document.getElementById('hueSlider');
        const sensSlider = document.getElementById('sensSlider');
        const playBtn = document.getElementById('playBtn');
        const recordBtn = document.getElementById('recordBtn');
        const audioElement = document.getElementById('audioElement');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        const logoFrame = document.getElementById('logoFrame');
        const logoImage = document.getElementById('logoImage');
