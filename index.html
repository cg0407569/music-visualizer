<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Flow Music Visualizer & Lyric Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030306;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #appContainer {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #lyricsContainer {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            text-align: center;
            width: 80%;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 229, 255, 0.6);
        }
        #currentLyric {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            transition: transform 0.1s ease;
        }
        #nextLyric {
            font-size: 20px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.5px;
        }
        #controlPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(8, 8, 14, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 14px;
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        .panelSection {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }
        .fileInputWrapper {
            position: relative;
            width: 100%;
            height: 38px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .fileInputWrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            height: 90px;
        }
        .sliderGroup {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #00e5ff;
            cursor: pointer;
        }
        .sliderVal {
            font-size: 11px;
            font-family: monospace;
            width: 30px;
            text-align: right;
            color: rgba(255, 255, 255, 0.8);
        }
        button {
            background: #00e5ff;
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover:not(:disabled) {
            background: #00b3cc;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.35);
        }
        button:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
        }
        #stampBtn {
            background: #ffe600;
            color: #000;
        }
        #stampBtn:hover:not(:disabled) {
            background: #cca700;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.35);
        }
        
        /* Spotify Player Dashboard Layout */
        #playerDashboard {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 60%;
            min-width: 450px;
            max-width: 800px;
            background: rgba(12, 12, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        .playerControls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .mainPlayBtn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: none;
        }
        .mainPlayBtn:hover:not(:disabled) {
            transform: scale(1.06);
            background: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .timelineContainer {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .timeLabel {
            font-size: 11px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.5);
            width: 45px;
        }
        .timeLabel.right { text-align: right; }
        .scrubBar {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
            transition: background 0.2s;
        }
        .scrubBar::-webkit-slider-runnable-track { width: 100%; height: 5px; cursor: pointer; }
        .scrubBar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            margin-top: -3.5px;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }
        #recordBtn { background: #ff0055; color: white; }
        #audioElement { display: none; }
    </style>
</head>
<body>

    <div id="appContainer">
        <canvas id="visualizerCanvas"></canvas>
        
        <div id="lyricsContainer">
            <div id="currentLyric">Load a song to begin flow...</div>
            <div id="nextLyric"></div>
        </div>

        <!-- Left Setup Panel: Generator Matrix -->
        <div id="controlPanel">
            <div class="panelSection">
                <label>1. Audio Track Source</label>
                <div class="fileInputWrapper">
                    <span id="audioTrackLabel" style="font-size:12px;color:rgba(255,255,255,0.7)">Choose audio file...</span>
                    <input type="file" id="audioInput" accept="audio/*">
                </div>
            </div>

            <div class="panelSection">
                <label>2. Live Lyric Timestamp Generator</label>
                <span style="font-size: 10px; color:rgba(255,255,255,0.4)">Paste text, play music, and tap Stamp or Spacebar on the beat:</span>
                <textarea id="lyricsTextarea" placeholder="Line 1 of song&#10;Line 2 of song&#10;Line 3 of song"></textarea>
                <button id="stampBtn" disabled>⚡ Stamp Current Line</button>
            </div>

            <div class="panelSection">
                <label>Aura Particle Color Hue</label>
                <div class="sliderGroup">
                    <input type="range" id="hueSlider" min="0" max="360" value="195">
                    <span class="sliderVal" id="hueVal">195</span>
                </div>
            </div>

            <div class="panelSection">
                <label>Bass Flow Velocity</label>
                <div class="sliderGroup">
                    <input type="range" id="sensSlider" min="1" max="5" step="0.1" value="2.5">
                    <span class="sliderVal" id="sensVal">2.5</span>
                </div>
            </div>
            
            <button id="recordBtn" disabled>Record Layout Video</button>
        </div>

        <!-- Bottom Spotify Dash: Seek and State Layout -->
        <div id="playerDashboard">
            <div class="timelineContainer">
                <span class="timeLabel" id="timeCurrent">0:00</span>
                <input type="range" id="scrubBar" class="scrubBar" min="0" max="100" value="0" step="0.1" disabled>
                <span class="timeLabel right" id="timeTotal">0:00</span>
            </div>
            <div class="playerControls">
